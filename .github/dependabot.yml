version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto

    target-branch: "Dev"

    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary

    # Keep the compatible ESLint toolchain pinned until the React plugins support ESLint 10.
    ignore:
      - dependency-name: eslint
      - dependency-name: "@eslint/js"
      # cypress-axe currently supports Cypress through 15; Babel syntax plugins require 7.
      - dependency-name: cypress
        update-types: [version-update:semver-major]
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]

    groups:
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"

      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto

    target-branch: "Dev"

    open-pull-requests-limit: 10

    labels:
      - dependencies
      - github-actions
