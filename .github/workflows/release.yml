name: Release npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Verify, attest, and publish
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Verify the release uses a signed annotated tag
        id: verify-release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable vX.Y.Z format." >&2
            exit 1
          fi

          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object')
          if [[ $(jq -r '.type' <<<"$tag_object") != "tag" ]]; then
            echo "Release tag must be an annotated, signed tag." >&2
            exit 1
          fi

          tag_sha=$(jq -r '.sha' <<<"$tag_object")
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")
          if [[ $(jq -r '.tag' <<<"$tag") != "$RELEASE_TAG" ]]; then
            echo "Verified tag object does not match the triggering release tag." >&2
            exit 1
          fi
          if [[ $(jq -r '.verification.verified' <<<"$tag") != "true" ]]; then
            echo "Release tag signature is not verified." >&2
            exit 1
          fi
          if [[ $(jq -r '.object.type' <<<"$tag") != "commit" ]]; then
            echo "Verified release tag must point directly to a commit." >&2
            exit 1
          fi

          verified_commit=$(jq -r '.object.sha' <<<"$tag")
          if [[ ! "$verified_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Verified release commit is not a valid Git SHA." >&2
            exit 1
          fi

          echo "commit_sha=${verified_commit}" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_RELEASE_COMMIT=${verified_commit}" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.verify-release-tag.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Assert checkout matches the verified release commit
        run: |
          if [[ $(git rev-parse HEAD) != "$VERIFIED_RELEASE_COMMIT" ]]; then
            echo "Checked-out source does not match the verified release commit." >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies
      - run: npm run audit
      - run: npm run stage:split-packages

      - name: Verify package versions and registry availability
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          for package_dir in types core next docs cli; do
            package_name=$(node -p "require('./packages/${package_dir}/package.json').name")
            package_version=$(node -p "require('./packages/${package_dir}/package.json').version")
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "${package_name} is ${package_version}; expected ${expected_version}." >&2
              exit 1
            fi
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists on npm." >&2
              exit 1
            fi
          done

      - name: Create release tarballs and integrity checksums
        run: |
          if [[ $(git rev-parse HEAD) != "$VERIFIED_RELEASE_COMMIT" ]]; then
            echo "Source changed from the verified release commit before packaging." >&2
            exit 1
          fi
          npm pack ./packages/types
          npm pack ./packages/core
          npm pack ./packages/next
          npm pack ./packages/docs
          npm pack ./packages/cli
          sha256sum ./*.tgz > SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "*.tgz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-artifacts
          path: |
            *.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Publish packages with npm provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [[ $(git rev-parse HEAD) != "$VERIFIED_RELEASE_COMMIT" ]]; then
            echo "Source changed from the verified release commit before publication." >&2
            exit 1
          fi
          npm publish ./packages/types --access public --provenance
          npm publish ./packages/core --access public --provenance
          npm publish ./packages/next --access public --provenance
          npm publish ./packages/docs --access public --provenance
          npm publish ./packages/cli --access public --provenance
